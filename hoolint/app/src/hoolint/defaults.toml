[settings]
stand_down_after = 2
git_ref = "auto"
semantic_model = "minishlab/potion-base-8M"

[[rule]]
id = "verbose-comments"
globs = ["**/*.py"]
# Advisory, not blocking: measured over three runs of the judge stage on 97
# ambiguous spans, precision was 0.55 and 11% of verdicts changed between runs.
# See docs/measurements/2026-08-01-verbose-comments-judge.md.
severity = "warn"

[[rule.stage]]
strategy = "regex"
# Hash-space only: RE2 has no lookahead, and `# ` already excludes shebangs
# and `#noqa`. The exclude list carries the rest of the known-benign shapes.
pattern = "(?m)(^[ \\t]*# [^\\n]*\\n){3,}"
exclude = ["(?i)(copyright|SPDX-License|licensed under)",
           "(?i)# *(noqa|type: *ignore|pylint|pragma|fmt: *off)",
           "^[ \\t]*# *(def |class |import |from |return |if |for |while )",
           # Anything fenced by a banner rule belongs to `comment-banners`, which
           # decides it for free. Judging these was 66% of this rule's LLM calls.
           "(?m)^[ \\t]*#[ \\t]*[-=*_#]{6,}[ \\t]*$"]
message = "more than 2 consecutive comment lines"

[[rule.stage]]
strategy = "semantic"
op = "and"
# Set from tests/test_semantic_calibration.py; re-run it (`pytest -m slow`) and
# record the measured rates here when you change this or the model.
# Measured on potion-base-8M, 20 labelled pairs: recall 1.00, fp 0.40.
# This gates the judge, so a miss is permanent while a false positive is merely
# judged and dropped downstream. Hence recall first. The labelled useful scores
# are bimodal (six <=0.244, four at 0.525-0.632 no usable threshold excludes),
# so 0.30 is the max-margin point in the gap below the lowest redundant, 0.361.
threshold = 0.30

[[rule.stage]]
strategy = "local_llm"
op = "and"
model = "qwen3:4b"
# The question is whether the comment says anything the adjacent code does not,
# which is answered by reading the span. Endpoints without the control ignore it.
reasoning_effort = "none"
max_candidates = 10
prompt = """Judge each numbered comment block below.
Reply with one line per block: `[N] VIOLATION: <reason>` or `[N] OK: <reason>`.
VIOLATION if the comment merely restates the adjacent code or pads with filler.
OK if it carries information the code cannot express — intent, a constraint, a
reference, a warning, or a reason for a non-obvious choice.

Comment blocks:
{span}"""

[[rule.stage]]
strategy = "escalate"
prompt = """Could this comment be expressed in at most 2 lines without losing
meaning? If yes, rewrite it. If it is genuinely necessary as written, leave it
and say so — do NOT waive on your own judgment. Waive only if the user
explicitly asked for this comment, and record that in the reason."""

[[rule]]
id = "comment-banners"
globs = ["**/*.py"]
severity = "warn"

[[rule.stage]]
strategy = "regex"
# A rule/title/rule block is decoration: the title repeats the name of the `def`
# or the section under it. One line between the rules is a title; two or more is
# usually a real note, and those are left to verbose-comments and its judge.
# Measured on structurella: 39 of 59 judge-confirmed spans, 1 of 53 it cleared.
pattern = """\
(?m)^[ \\t]*#[ \\t]*[-=*_#]{6,}[ \\t]*\\n\
[ \\t]*#[^\\n]*\\n\
[ \\t]*#[ \\t]*[-=*_#]{6,}[ \\t]*$"""
message = "section banner comment: the code below already says what section this is"

[[rule]]
id = "doc-broken-links"
globs = ["**/*.md"]
severity = "warn"

[[rule.stage]]
strategy = "doc_links"

# An em dash is the one AI writing tell worth checking mechanically. The rest of
# the usual list (lazy extremes, adverbs) reads as slop in an essay and as
# precision in a spec: "never stdlib `re`" is a constraint, not false authority.
# Measured on this repo's own markdown, a word-level port would have been mostly
# false positives. This one is context-free. Use a comma, a period, or brackets.
[[rule]]
id = "em-dashes"
globs = ["**/*.md"]
severity = "warn"

[[rule.stage]]
strategy = "prose_pattern"
pattern = "—"
message = "em dash: use a comma, a period, or parentheses"

# The only anti-slop word list that survived measurement: 487 hits over 1.29M
# prose lines across four repos, ~86% true positive. The famous phrases ("delve
# into", "in today's fast-paced world", "furthermore") scored exactly zero on
# that corpus, and the hedging and meta-commentary lists were 100% false
# positives: "may or may not be synced" is precision, "## What's in This
# Section" is a heading. `utilization` is deliberately not matched. It is domain
# vocabulary ("connection pool utilization") and appears inside test ids.
[[rule]]
id = "use-not-leverage"
globs = ["**/*.md"]
severity = "warn"

[[rule.stage]]
strategy = "prose_pattern"
pattern = "(?i)\\b(leverag(e|es|ed|ing)|utiliz(e|es|ed|ing))\\b"
message = "say 'use'"

[[rule]]
id = "doc-drift"
globs = ["**/*.md"]
severity = "warn"

[[rule.stage]]
strategy = "doc_refs"

[[rule.stage]]
strategy = "escalate"
prompt = """This doc references a file that no longer exists. Update the doc if
the reference is stale. If the reference is deliberate (a planned path, an
example), say so and leave it — waive only with the user's explicit sanction."""
