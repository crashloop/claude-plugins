[project]
name = "hoolint"
version = "0.1.0"
description = "Stacked-strategy checks for code and docs, driven by Claude Code hooks."
requires-python = ">=3.13"
dependencies = [
    "model2vec>=0.3",
    "httpx>=0.27",
    "google-re2>=1.1",
    "tomlkit>=0.15.1",
    "numpy>=2.5.1",
]

[project.scripts]
hoolint = "hoolint.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoolint"]

[tool.pytest.ini_options]
markers = ["slow: needs downloaded embedding model"]
addopts = "-m 'not slow'"
